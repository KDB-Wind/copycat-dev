<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三件小工具 — 文本整理 / 线索抽取 / 资料卡</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f13;color:#e9edf4;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:48px 16px 64px}
  h1{font-size:26px;margin:0 0 10px;letter-spacing:-.3px}
  p.lede{color:#98a2b3;margin:0 0 32px;font-size:15px}
  a.item{display:block;text-decoration:none;color:inherit;background:#161a21;border:1px solid #262d38;border-radius:16px;
    padding:18px;margin-bottom:12px;transition:.15s}
  a.item:hover{border-color:#3d4756;transform:translateY(-1px)}
  .n{font-size:12px;font-weight:700;letter-spacing:.14em;color:#5eead4;text-transform:uppercase}
  .t{font-size:18px;font-weight:700;margin:6px 0 4px}
  .d{font-size:14.5px;color:#9aa5b5;margin:0}
  .url{font-size:12.5px;color:#5b6673;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace}
  footer{margin-top:36px;color:#5b6673;font-size:13px;border-top:1px solid #1d232c;padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>三件小工具</h1>
  <p class="lede">都是单页网页、打开就能用、不用注册、内容不上传。手机上也行。</p>

  <a class="item" href="./p1/">
    <div class="n">01 · 文字</div>
    <div class="t">文本整理器</div>
    <p class="d">把从 Word、微信、PDF 复制出来的乱标点、多余空格、一堆空行，一键整理成能直接发的东西。</p>
    <div class="url">/p1/</div>
  </a>

  <a class="item" href="./p2/">
    <div class="n">02 · 数据</div>
    <div class="t">线索抽取器</div>
    <p class="d">一整段聊天记录或报价单，抽出邮箱、电话、链接、金额，自动去重，能导出 CSV。</p>
    <div class="url">/p2/</div>
  </a>

  <a class="item" href="./p3/">
    <div class="n">03 · 表单</div>
    <div class="t">资料卡</div>
    <p class="d">姓名、地址、税号这些每次填表都要重打一遍的信息，存一次在本机，点一下复制。</p>
    <div class="url">/p3/</div>
  </a>

  <footer>
    三个工具彼此独立，数据都留在你自己的浏览器里。目前内测免费。
  </footer>
</div>
</body>
</html>
